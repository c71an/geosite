name: Build geosite.dat

on:
  push:
    branches:
      - main

  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Git
        run: |
          git --version
          python3 --version
          go version

      - name: Build geosite.dat
        run: |
          python3 converter/convert.py

      - name: Check output
        run: |
          ls -lh dist/
          sha256sum dist/geosite.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest geosite.dat
          files: |
            dist/geosite.dat
            dist/geosite.dat.sha256
          prerelease: false
          make_latest: true